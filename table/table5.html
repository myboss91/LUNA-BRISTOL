<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        table{width: 500px; border: 1px solid; border-color: paleturquoise; border-collapse: collapse;}
        th{border: 1px solid; border-color: blue; background-color: aquamarine;}
        td{border: 1px solid; border-color: blue;}
        .misca{ background-color: blueviolet;}
        .musca{background-color: brown;}
        .mickey{background-color: blueviolet;}
        .andmini{background-color: brown;}
        .mouse{background-color: bluevioletn;}
    </style>
</head>
<body>
    <table>
        <thead>
            <th>A</th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
        </thead>
        <tbody>
            <tr class="misca">
                <td>E</td>
                <td>F</td>
                <td>G</td>
                <td>H</td>
            </tr>
             <tr class="musca">
                <td>I</td>
                <td>J</td>
                <td>K</td>
                <td>L</td>
            </tr>
             <tr class="mickey">
                <td>M</td>
                <td>N</td>
                <td>O</td>
                <td>P</td>
            </tr>
             <tr class="andmini">
                <td>Q</td>
                <td>R</td>
                <td>S</td>
                <td>T</td>
            </tr>
             <tr class="mouse">
                <td>U</td>
                <td>V</td>
                <td>W</td>
                <td>X</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
